name: Windows engine

# Builds reroll-engine.exe (the editing engine + FFmpeg, no Python needed) on a Windows runner,
# runs the self-test with it, and uploads the zip as a build artifact.
on:
  push:
    branches: [main]
    paths: ["clipthat_editor/**", "packaging/**", ".github/workflows/windows-engine.yml"]
  workflow_dispatch:

concurrency:
  group: windows-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_VERSION: "7.1.1"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install -r packaging/requirements-windows.txt

      - name: FFmpeg (Gyan.dev essentials build, includes libx264)
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip"
          Invoke-WebRequest $url -OutFile $zip
          "sha256 $((Get-FileHash $zip -Algorithm SHA256).Hash)"
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ff"
          $root = (Get-ChildItem "$env:RUNNER_TEMP\ff" -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force packaging\ffmpeg | Out-Null
          Copy-Item "$root\bin\ffmpeg.exe", "$root\bin\ffprobe.exe" packaging\ffmpeg\
          Copy-Item "$root\LICENSE" packaging\ffmpeg\LICENSE.txt
          & packaging\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          echo "::notice title=FFmpeg::$((& packaging\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1))"

      - name: Build reroll-engine.exe
        run: |
          pyinstaller --noconfirm --clean --console --name reroll-engine `
            --paths . --collect-submodules clipthat_editor `
            --add-data "clipthat_editor/assets:clipthat_editor/assets" `
            --add-data "clipthat_editor/taste:clipthat_editor/taste" `
            --add-data "clipthat_editor/sounds.json:clipthat_editor" `
            --exclude-module matplotlib --exclude-module pandas --exclude-module pytest --exclude-module _pytest `
            --exclude-module tkinter --exclude-module IPython --exclude-module setuptools --exclude-module pkg_resources `
            --exclude-module lxml `
            packaging\reroll_engine.py
          Copy-Item -Recurse packaging\ffmpeg dist\reroll-engine\ffmpeg
          $mb = [math]::Round(((Get-ChildItem dist\reroll-engine -Recurse | Measure-Object Length -Sum).Sum / 1MB), 1)
          echo "::notice title=Size::reroll-engine folder is $mb MB"

      - name: Self-test (temp folder)
        run: |
          $out = & dist\reroll-engine\reroll-engine.exe selftest
          $out
          $r = $out | Out-String | ConvertFrom-Json
          if (-not $r.ok) { echo "::error title=Self-test::$($r.failed)"; exit 1 }
          if ($r.ffmpeg -notlike "*reroll-engine\ffmpeg\*") { echo "::error title=Self-test::used $($r.ffmpeg), not the bundled FFmpeg"; exit 1 }
          echo "::notice title=Self-test::ok in $($r.seconds_taken)s, $($r.render.width)x$($r.render.height), $($r.render.seconds)s video"

      - name: Self-test (folder with a space and an apostrophe)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Edward's clips"
          $out = & dist\reroll-engine\reroll-engine.exe selftest --work "$dir"
          $out
          $r = $out | Out-String | ConvertFrom-Json
          if (-not $r.ok) { echo "::error title=Self-test (odd path)::$($r.failed)"; exit 1 }

      - name: Zip
        run: Compress-Archive dist\reroll-engine reroll-engine-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: reroll-engine-windows-x64
          path: reroll-engine-windows-x64.zip
          retention-days: 30
