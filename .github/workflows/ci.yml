name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # End-to-end tests fail instead of skipping when a tool is missing.
  CLIPTHAT_REQUIRE_E2E: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Renderer + web prototype (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -r web/requirements-dev.txt
      - name: Renderer tests
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E "^(Ran [0-9]+ tests|OK|FAILED)" test.log | tail -2 | tr "\n" " ")
          echo "::notice title=Renderer tests::${summary:-no summary line}"
          exit $status
      - name: Web tests
        run: |
          set +e
          python -m pytest -q -rs web/tests 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E "(passed|failed|skipped)" test.log | tail -2 | tr "\n" " ")
          echo "::notice title=Web tests::${summary:-no summary line}"
          exit $status

  swift-linux:
    name: Swift on Linux (contracts, desktop core, Vapor)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Tools for end-to-end tests
        run: apt-get update && apt-get install -y --no-install-recommends ffmpeg python3 libsqlite3-dev
      - name: ClipThatContracts
        working-directory: swift-shared
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E "(Executed [0-9]+ tests|Test run with [0-9]+ tests|tests? (passed|failed))" test.log | tail -2 | tr "\n" " ")
          echo "::notice title=Linux contracts::${summary:-no summary line}"
          exit $status
      - name: Desktop core
        working-directory: desktop/Core
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E "(Executed [0-9]+ tests|Test run with [0-9]+ tests|tests? (passed|failed))" test.log | tail -2 | tr "\n" " ")
          echo "::notice title=Linux desktop core::${summary:-no summary line}"
          exit $status
      - name: Vapor backend
        working-directory: web-swift
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E "(Executed [0-9]+ tests|Test run with [0-9]+ tests|tests? (passed|failed))" test.log | tail -2 | tr "\n" " ")
          echo "::notice title=Linux Vapor::${summary:-no summary line}"
          exit $status

  macos:
    name: macOS app (Xcode build + core tests)
    # macOS runner minutes cost ~10x Linux on private repos: run on main and on demand only.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - run: brew install xcodegen ffmpeg
      - name: ClipThatContracts
        working-directory: swift-shared
        run: |
          set +e
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E "(Executed [0-9]+ tests|Test run with [0-9]+ tests|tests? (passed|failed))" test.log | tail -2 | tr "\n" " ")
          echo "::notice title=macOS contracts::${summary:-no summary line}"
          exit $status
      - name: Desktop core (includes end-to-end render through the real renderer)
        working-directory: desktop/Core
        run: |
          set +e
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E "(Executed [0-9]+ tests|Test run with [0-9]+ tests|tests? (passed|failed))" test.log | tail -2 | tr "\n" " ")
          echo "::notice title=macOS desktop core::${summary:-no summary line}"
          exit $status
      - name: Generate Xcode project
        working-directory: desktop
        run: xcodegen generate
      - name: Build app (unsigned in CI)
        working-directory: desktop
        run: |
          set -o pipefail
          xcodebuild -project ClipThat.xcodeproj -scheme ClipThat -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build | tee build.log | grep -E "error:|warning: .*ClipThat|BUILD (SUCCEEDED|FAILED)" || true
          echo "::notice title=Xcode build::$(grep -c ' warning: ' build.log) warnings, $(grep -c ' error: ' build.log) errors"
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: desktop/build.log
          if-no-files-found: ignore
