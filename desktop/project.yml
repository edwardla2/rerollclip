# XcodeGen spec for the Clip That macOS app.
# Regenerate after adding/removing files:   xcodegen generate   (or scripts/bootstrap.sh)
name: ClipThat
options:
  bundleIdPrefix: now.kova
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    # Pinned so macOS privacy permissions (Screen Recording, Microphone) survive rebuilds.
    # An ad-hoc signature changes every build and makes macOS forget the grants.
    DEVELOPMENT_TEAM: VXYH2JZJT3
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # The "Bundle editor" phase reads ../clipthat_editor, outside the project folder.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  ClipThatCore:
    path: Core
targets:
  ClipThat:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: ClipThatCore
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Clip That
        CFBundleName: Clip That
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: >-
          Clip That listens for you to say “Clip that” and, only if you turn it on,
          records your microphone into saved clips. Audio stays on this Mac.
        NSSpeechRecognitionUsageDescription: >-
          Clip That uses on-device speech recognition to notice when you say “Clip that”.
          Nothing is sent to a server.
    entitlements:
      path: App/Resources/ClipThat.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: now.kova.clipthat
        PRODUCT_NAME: Clip That
        PRODUCT_MODULE_NAME: ClipThat
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      - name: Bundle Clip That editor
        basedOnDependencyAnalysis: false
        script: |
          # Copies ChatGPT's render engine (unmodified) into the app bundle so the app
          # can run `python3 -m clipthat_editor` without any user-specific paths.
          set -euo pipefail
          SRC="${SRCROOT}/../clipthat_editor"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/editor"
          if [ ! -f "${SRC}/__main__.py" ]; then
            echo "error: clipthat_editor not found at ${SRC}"
            exit 1
          fi
          rm -rf "${DEST}"
          mkdir -p "${DEST}/clipthat_editor"
          rsync -a --exclude '__pycache__' --exclude '*.pyc' "${SRC}/" "${DEST}/clipthat_editor/"
